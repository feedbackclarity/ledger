# DigitalOcean App Platform spec
# Use this with `doctl apps create --spec .do/app.yaml` OR paste contents in DO web UI

name: ledger
region: nyc
services:
  - name: web
    github:
      # FILL THESE IN BEFORE DEPLOY:
      repo: YOUR_GITHUB_USERNAME/ledger
      branch: main
      deploy_on_push: true
    build_command: npm install && npm run build
    run_command: npm start
    environment_slug: node-js
    instance_size_slug: basic-xxs
    instance_count: 1
    http_port: 3000
    routes:
      - path: /
    envs:
      - key: NEXTAUTH_SECRET
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_WITH_LONG_RANDOM_STRING
      - key: NEXTAUTH_URL
        scope: RUN_TIME
        value: ${APP_URL}
      - key: LEDGER_PASSWORD
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_WITH_YOUR_PASSWORD
      - key: DATA_DIR
        scope: RUN_TIME
        value: /workspace/data
      - key: UPLOADS_DIR
        scope: RUN_TIME
        value: /workspace/uploads
